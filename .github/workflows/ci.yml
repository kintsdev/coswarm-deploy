name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Rebuild bundle
        run: npm run bundle

      - name: Verify committed bundle is up to date
        run: |
          if ! git diff --exit-code -- build/; then
            echo "::error::build/ is out of date. Run 'npm run bundle' and commit the result."
            exit 1
          fi
